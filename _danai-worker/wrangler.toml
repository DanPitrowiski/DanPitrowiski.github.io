name = "danai"
main = "worker.js"
compatibility_date = "2026-11-01"

# Lets worker.js import knowledge.md as text
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
MODEL = "claude-haiku-5-5"

# 20 questions per minute per visitor. Delete this block if deploy complains about it.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

# The question log (see schema.sql and README.md).
# Paste the database_id that `npx wrangler d1 create danai-questions` prints.
[[d1_databases]]
binding = "DB"
database_name = "danai-questions"
database_id = "aa708193-3a5e-4f9d-815a-d302d1a56927"
